# 請以繁體中文產生程式碼註解。請務必保持 UTF-8 編碼。
#
# 檔案名稱：Hydra 日誌格式設定
# 功能說明：只輸出到主控台，不額外產生日誌檔，保持專案目錄乾淨。
#           啟動時加上 hydra.job_logging.root.level=DEBUG 可觀察各節點耗時。
# 建立日期：2024-12-18

version: 1
disable_existing_loggers: false

formatters:
  simple:
    format: "[%(asctime)s][%(levelname)s][%(name)s] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: simple
    stream: ext://sys.stdout

root:
  level: INFO
  handlers: [console]
