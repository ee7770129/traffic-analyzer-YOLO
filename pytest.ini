; 請務必保持 UTF-8 編碼。
;
; 檔案名稱：pytest 設定
; 功能說明：測試探索規則與覆蓋率門檻。
;           專案規範要求整體覆蓋率 >= 70%，低於門檻時測試視為失敗。
; 建立日期：2026-10-03

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --cov=core
    --cov=nodes
    --cov=utils
    --cov=tools
    --cov=cython_bbox
    --cov-report=term-missing:skip-covered
    --cov-fail-under=70

filterwarnings =
    ignore::DeprecationWarning
